name: Review queue SLA sweep and engine smoke

# Releases any reading that has been waiting for a person for more than 10 hours, and (every
# 30 minutes) renders a real compatibility reading through the deployed engine.
#
# Why GitHub Actions and not a Vercel cron: the account is on the Hobby plan, which allows two
# cron jobs and runs them once a day — far too coarse for a ten-hour rule. A scheduled workflow
# every 15 minutes costs nothing and lands the release within 10h + 15 min of the deadline.
#
# AU-03 (2026-10-26 audit): the sweep used to answer 200 even when it had counted stuck or failed
# jobs, so this workflow was green through five days of the engine refusing every render. The
# endpoint now answers 503 in that state, the body is checked as a second line of defence, and a
# scheduled smoke renders a real reading end to end — the check that would have caught it.
#
# The endpoint is idempotent (a reading that was released is no longer in the queue), so a delayed
# or duplicated run is harmless. It also reports jobs the dispatcher has not picked up.
#
# The secret is the same CRON_SECRET the app authenticates its other crons with.
on:
  schedule:
    - cron: "*/15 * * * *" # SLA sweep
    - cron: "*/30 * * * *" # engine smoke (a real render; half as often)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sla-sweep
  cancel-in-progress: false

jobs:
  sweep:
    # Both cron entries fire at :00 and :30; only the 15-minute event runs the sweep.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Release readings past the 10-hour deadline
        env:
          APP_URL: https://www.cosmicsaju.com
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Capture the body as well as the status: `curl -f` alone discards the counts we need.
          http_code="$(curl -sS --max-time 120 -o "$RUNNER_TEMP/sla-sweep.json" -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/sla")"
          echo "HTTP $http_code"
          cat "$RUNNER_TEMP/sla-sweep.json"; echo
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::SLA sweep returned HTTP $http_code"
            exit 1
          fi
          echo "sweep complete"

      - name: Fail when the sweep reports stuck or recently failed jobs
        # A non-zero count is the outage signal, even if some future change lets it through with
        # a 200. Never let this step pass on a body it cannot read.
        run: |
          result="$RUNNER_TEMP/sla-sweep.json"
          stuck="$(jq -r '.stuckJobs // empty' "$result")"
          failures="$(jq -r '.recentFailures // empty' "$result")"
          if [ -z "$stuck" ] || [ -z "$failures" ]; then
            echo "::error::the sweep response did not include stuckJobs and recentFailures"
            exit 1
          fi
          case "$stuck$failures" in
            *[!0-9]*)
              echo "::error::non-numeric counts in the sweep response (stuckJobs=$stuck recentFailures=$failures)"
              exit 1
              ;;
          esac
          echo "stuckJobs=$stuck recentFailures=$failures"
          if [ "$stuck" -ne 0 ] || [ "$failures" -ne 0 ]; then
            echo "::error::SLA sweep degraded — stuckJobs=$stuck recentFailures=$failures"
            exit 1
          fi

  smoke:
    # Half as often as the sweep: this is a real end-to-end render, not a probe.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check the smoke's credentials
        # Fails loudly, naming the secret and never its value: a smoke that cannot run must not
        # pass. AU-03 is precisely the failure mode of a check that was green because it did not
        # exercise the real path.
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ENGINE_URL: ${{ secrets.ENGINE_URL }}
          ENGINE_SERVICE_TOKEN: ${{ secrets.ENGINE_SERVICE_TOKEN }}
        run: |
          missing=""
          for name in R2_ENDPOINT R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY \
                      ENGINE_URL ENGINE_SERVICE_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::engine smoke cannot run; add these repository secrets:$missing"
            exit 1
          fi

      - name: Render a compatibility reading end to end
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ENGINE_URL: ${{ secrets.ENGINE_URL }}
          ENGINE_SERVICE_TOKEN: ${{ secrets.ENGINE_SERVICE_TOKEN }}
        run: python3 tools/smoke_compat_reading.py basic
